<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Plans - English Section</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body dir="ltr">

    <div id="login-form">
        <div class="login-card">
            <img id="logo"
                 src="https://cdn.glitch.global/1c613b14-019c-488a-a856-d55d64d174d0/al-kawthar-international-schools-jeddah-saudi-arabia-modified.png?v=1739565146299"
                 alt="Logo">
            <h1>Login</h1>
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button id="login-button" class="pro-button">Login</button>
            <p id="login-error"></p>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <div class="main-header-container">
            <img id="logo-main"
                 src="https://cdn.glitch.global/1c613b14-019c-488a-a856-d55d64d174d0/al-kawthar-international-schools-jeddah-saudi-arabia-modified.png?v=1739565146299"
                 alt="Logo">
            <div class="title-user-info">
                 <h1 id="main-title">Weekly Plans</h1>
                 <h2 id="weekDateRange"></h2>
                 <div class="user-actions-container">
                    <span id="loggedInUserInfo"></span>
                    <button id="logout-button" class="pro-button danger-button">Logout</button>
                 </div>
            </div>
        </div>

        <div class="filter-container">
            <label for="weekSelector">Week:</label>
            <select id="weekSelector" onchange="loadPlanForWeek()">
                 <option value="">-- Select --</option>
                 <script>
                    for(let i=1; i<=48; i++) document.write(`<option value="${i}">Week ${i}</option>`);
                 </script>
            </select>
        </div>

        <div id="admin-actions" class="filter-container" style="display: none;">
             <h3>Admin Actions</h3>
             <input type="file" id="excelFileInput" accept=".xlsx, .xls" onchange="handleFileUpload(event)">
             <button id="saveUploadedDataBtn" onclick="saveUploadedData()" disabled class="pro-button accent-button">Save to DB</button>
        </div>

        <div class="filter-container">
            <button id="generateWordBtn" onclick="generateWordByClasse()" class="pro-button" disabled>Word Export</button>
            <button id="generateExcelBtn" onclick="generateExcelWorkbook()" class="pro-button" disabled>Excel Export</button>
            <button id="generateAllDisplayedPlansBtn" onclick="generateAllDisplayedLessonPlans()" class="pro-button success-button" disabled>AI Plans (All)</button>
        </div>

        <div class="filter-container">
             <label>Teacher:</label><select id="filterEnseignant" onchange="sortAndDisplay()"></select>
             <label>Class:</label><select id="filterClasse" onchange="sortAndDisplay()"></select>
        </div>

        <div id="message-alerte" style="display: none;"></div>
        <div id="progress-bar-container" style="display: none;"><div id="progress-bar"></div></div>

        <div class="table-responsive-wrapper">
            <table id="planTable">
                <thead><tr></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Modal AI -->
    <div id="lessonPlanModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000;">
        <div style="background: white; margin: 100px auto; max-width: 500px; padding: 20px; border-radius: 10px;">
            <h2>AI Lesson Plans Selection</h2>
            <div id="lessonPlanClassesList"></div>
            <button id="generateAllLessonPlansBtn" onclick="startGenerateAllLessonPlans()" class="pro-button success-button">Generate</button>
            <button onclick="closeLessonPlanModal()" class="pro-button">Cancel</button>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="lesson_functions_new.js"></script>
    <script src="script.js"></script>
</body>
</html>
